[project]
name = "caresync"
version = "1.0.0"
description = "Shared elderly care and medication management platform."
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# B008: FastAPI's Depends()/Query() in defaults is the framework's idiom.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Tests use asserts and fixed dummy credentials by design.
"tests/*" = ["S101", "S105", "S106"]
