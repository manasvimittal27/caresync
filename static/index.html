<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="CareSync: shared medication and appointment care for elderly people, their caretakers and family." />
    <meta name="theme-color" content="#0b4f6c" />
    <title>CareSync</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>

    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="#/today" aria-label="CareSync home">
          <svg aria-hidden="true" focusable="false" width="32" height="32" viewBox="0 0 32 32">
            <circle cx="16" cy="16" r="15" class="brand-ring" />
            <path d="M16 24s-7-4.4-7-9.3A3.9 3.9 0 0 1 16 12a3.9 3.9 0 0 1 7 2.7C23 19.6 16 24 16 24z" class="brand-heart" />
          </svg>
          <span>CareSync</span>
        </a>
        <div class="header-tools">
          <div class="text-size" role="group" aria-label="Text size">
            <button type="button" class="btn-ghost" data-text-size="normal" aria-pressed="true">A</button>
            <button type="button" class="btn-ghost size-lg" data-text-size="large" aria-pressed="false">A+</button>
            <button type="button" class="btn-ghost size-xl" data-text-size="xlarge" aria-pressed="false">A++</button>
          </div>
          <div id="user-box" class="user-box" hidden>
            <span id="user-name" class="user-name"></span>
            <span id="user-role" class="badge"></span>
            <button type="button" id="sign-out" class="btn-secondary">Sign out</button>
          </div>
        </div>
      </div>
      <nav id="app-nav" class="app-nav" aria-label="Main" hidden>
        <ul>
          <li><a href="#/today" data-route="today">Today</a></li>
          <li><a href="#/medicines" data-route="medicines">Medicines</a></li>
          <li><a href="#/appointments" data-route="appointments">Appointments</a></li>
          <li><a href="#/circle" data-route="circle">Care circle</a></li>
          <li><a href="#/activity" data-route="activity">Activity</a></li>
        </ul>
      </nav>
    </header>

    <main id="main" tabindex="-1">
      <noscript><p class="notice">CareSync needs JavaScript turned on.</p></noscript>
      <div id="view" aria-busy="true"></div>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

    <dialog id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-message">
      <form method="dialog" class="dialog-body">
        <h2 id="confirm-title">Please confirm</h2>
        <p id="confirm-message"></p>
        <div class="actions">
          <button type="submit" value="cancel" class="btn-secondary">Cancel</button>
          <button type="submit" value="confirm" class="btn-danger" id="confirm-yes">Yes, continue</button>
        </div>
      </form>
    </dialog>

    <footer class="site-footer">
      <p>CareSync supports care decisions. It does not replace advice from a doctor or pharmacist.</p>
    </footer>
  </body>
</html>
